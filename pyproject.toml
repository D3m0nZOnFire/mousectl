[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mousectl"
dynamic = ["version"]
description = "Configure gaming mice on Linux over /dev/hidraw*, without vendor software"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/D3m0nZOnFire/mousectl"

[project.scripts]
mousectl = "mousectl.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mousectl.__version__" }

[tool.setuptools.packages.find]
include = ["mousectl*"]
