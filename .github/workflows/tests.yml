name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.14"]   # 3.9 is the minimum bin/mousectl promises
        os: [ubuntu-latest]
        include:
          # setup-python has no 3.9 build for ubuntu-latest (26.04) any more.
          - python: "3.9"
            os: ubuntu-24.04
        exclude:
          - python: "3.9"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile everything
        run: python -m compileall -q mousectl tests
      - name: Unit and driver contract tests
        run: python -m unittest -v
      - name: CLI starts without a mouse
        env:
          PYTHON: python
        run: |
          bin/mousectl --help > /dev/null
          bin/mousectl keys --help > /dev/null
          bin/mousectl list
      - name: Installs as a package (pipx/pip)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q .
          cd /tmp && /tmp/venv/bin/mousectl --help > /dev/null
